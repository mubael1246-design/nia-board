<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>자매들의 일기장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Cinzel:wght@500;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'OuroborosHand';src:url('../hub/assets/font/OuroborosHand.woff2') format('woff2');font-display:swap}
:root{--bg:#0b0807;--ink:#efe9df;--mute:#9a93a6;--nia:#d9b06a;--mina:#e0505a;--cora:#3fcfc4;--eris:#A066FF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(120% 70% at 50% 0%,#2a1c14 0%,#120c09 55%,#07050a 100%) fixed;color:var(--ink);font-family:'Gowun Batang',serif;-webkit-font-smoothing:antialiased}
body{padding:calc(env(safe-area-inset-top,0px) + 79px) 0 calc(env(safe-area-inset-bottom,0px) + 30px)}
/* topfix: shared "← 허브로" (same as other pages) */
.topfix{position:fixed;top:calc(env(safe-area-inset-top,0px) + 21px);left:calc(env(safe-area-inset-left,0px) + 14px);z-index:1000;height:44px;display:inline-flex;align-items:center;padding:0 14px;border-radius:22px;background:rgba(10,12,18,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);box-shadow:0 2px 10px rgba(0,0,0,.35);font:500 13px/1 'Gowun Batang',system-ui,sans-serif;letter-spacing:.06em;color:#d8d4cc;text-decoration:none}
.topfix.r{left:auto;right:calc(env(safe-area-inset-right,0px) + 14px)}
h1{font-family:'Cinzel',serif;font-weight:500;text-align:center;letter-spacing:.18em;font-size:15px;color:#e8cfa0;margin:4px 0 2px}
.sub{text-align:center;font-family:'OuroborosHand','Nanum Pen Script',cursive;font-size:22px;color:#cdb38a;margin:0 0 18px}
/* gate */
#gate{max-width:320px;margin:60px auto;text-align:center;padding:0 20px}
#gate input{width:100%;padding:14px;border-radius:12px;border:1px solid #ffffff22;background:#0008;color:#fff;font:16px 'Gowun Batang';text-align:center}
#gate button{margin-top:10px;width:100%;padding:13px;border-radius:12px;border:1px solid #e8cfa055;background:#3a2a1a;color:#f2dfb8;font:15px 'Gowun Batang'}
#gerr{min-height:22px;color:#e9a0a0;font-size:13px;margin-top:8px}
/* shelf */
#shelf{display:none;max-width:460px;margin:0 auto;padding:0 14px}
.tier{position:relative;display:flex;justify-content:space-around;align-items:flex-end;gap:14px;padding:22px 16px 0;margin-bottom:34px;
  background:linear-gradient(#1a110b,#24170e);border-radius:6px 6px 0 0;box-shadow:inset 0 10px 24px #0009,inset 0 0 0 1px #3a2615}
.tier:after{content:'';position:absolute;left:-10px;right:-10px;bottom:-18px;height:18px;border-radius:2px;
  background:linear-gradient(#7a5132,#4e321e 60%,#2e1d10);box-shadow:0 10px 18px #000a,inset 0 1px 0 #a87a50}
.book{position:relative;width:132px;aspect-ratio:3/4.1;border:0;padding:0;cursor:pointer;border-radius:3px 9px 9px 3px;
  background:var(--cv);box-shadow:inset 7px 0 0 rgba(0,0,0,.28),inset 9px 0 0 rgba(255,255,255,.06),0 8px 14px #000b;transition:transform .35s cubic-bezier(.2,.8,.3,1);transform-origin:bottom center}
.book:active,.book:hover{transform:translateY(-8px) rotate(-1.5deg)}
.book .ttl{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-family:'OuroborosHand','Nanum Pen Script',cursive;font-size:22px;color:var(--tc)}
.book .ribbon{position:absolute;bottom:-22px;left:40px;width:9px;height:30px;background:var(--rb);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);z-index:-1}
.book .lock{position:absolute;right:-5px;top:50%;width:16px;height:30px;margin-top:-15px;border-radius:3px;background:linear-gradient(90deg,#8a6420,#f0cf72,#a87b28);box-shadow:0 1px 3px #000a}
.book .lock:after{content:'';position:absolute;left:3px;top:9px;width:10px;height:10px;background:#3b2a0a;clip-path:var(--lk)}
.book .cnt{position:absolute;top:8px;right:14px;font-size:10px;color:var(--tc);opacity:.7;letter-spacing:.1em}
.emb{position:absolute;inset:10px 12px 10px 16px;border-radius:2px 6px 6px 2px;pointer-events:none}
/* per-sister covers */
.nia{--cv:linear-gradient(135deg,#f3eadb,#e2d3ba 60%,#d8c5a6);--tc:#9b7735;--rb:linear-gradient(#e8e8ee,#a9abb5);--lk:circle(40%)}
.nia .emb{border:1.5px solid #c9a35f99;box-shadow:inset 0 0 0 4px #f3eadb,inset 0 0 0 5px #c9a35f55;
  background:linear-gradient(90deg,transparent 18%,#c9a35f66 18% 19%,transparent 19%) top/100% 1.5px no-repeat,linear-gradient(transparent 70%,#b8505033 100%)}
.nia .emb:after{content:'';position:absolute;right:-1.5px;bottom:-1.5px;width:38%;height:30%;border-right:1.5px solid #c0545c;border-bottom:1.5px solid #c0545c;border-radius:0 0 6px 0;opacity:.75}
.mina{--cv:linear-gradient(140deg,#6d1424,#4a0b17 60%,#320710);--tc:#e8c878;--rb:linear-gradient(#f0cf72,#a87b28);--lk:path('M5 9C4 8 0 6 0 3C0 1 1.5 0 2.7 0C3.7 0 4.5.6 5 1.5C5.5.6 6.3 0 7.3 0C8.5 0 10 1 10 3C10 6 6 8 5 9Z')}
.mina .emb:before,.mina .emb:after{content:'❦';position:absolute;font-size:30px;color:#d4ae5c;opacity:.75;line-height:1}
.mina .emb:before{left:-4px;top:-6px;transform:rotate(-90deg)}.mina .emb:after{right:-2px;bottom:18px;transform:rotate(90deg)}
.mina .ribbon{clip-path:none;width:6px;border-radius:0 0 50% 50%/0 0 30% 30%}
.eris{--cv:linear-gradient(140deg,#1c1820,#0b090e 70%);--tc:#e9c66a;--rb:linear-gradient(#b07cff,#6b2fd0);--lk:path('M5 9C4 8 0 6 0 3C0 1 1.5 0 2.7 0C3.7 0 4.5.6 5 1.5C5.5.6 6.3 0 7.3 0C8.5 0 10 1 10 3C10 6 6 8 5 9Z')}
.eris .emb{border:2px solid #d6b25e;box-shadow:inset 0 0 0 3px #0b090e,inset 0 0 0 4px #d6b25e88}
.eris .emb:before{content:'';position:absolute;left:50%;top:40%;width:34px;height:31px;margin:-16px 0 0 -17px;background:#a066ff;filter:drop-shadow(0 0 6px #a066ff);
  clip-path:path('M17 31C15 29 0 20 0 9C0 3 4 0 8.5 0C12 0 15.5 2 17 5.5C18.5 2 22 0 25.5 0C30 0 34 3 34 9C34 20 19 29 17 31Z')}
.eris .emb:after{content:'';position:absolute;left:14%;right:14%;top:40%;height:1px;background:linear-gradient(90deg,transparent,#a066ffaa 20%,transparent 38%,transparent 62%,#a066ffaa 80%,transparent);box-shadow:0 18px 0 #a066ff55,0 -18px 0 #a066ff55;animation:glow 3s ease-in-out infinite}
.eris .ribbon{clip-path:polygon(0 0,100% 0,100% 70%,50% 100%,0 70%);width:11px}
@keyframes glow{50%{opacity:.35}}
.cora{--cv:linear-gradient(140deg,#11454a,#0b3236 60%,#08262a);--tc:#e8d9b4;--rb:linear-gradient(#efe3cc,#d6c6a6);--lk:polygon(50% 0,62% 18%,82% 12%,80% 34%,100% 45%,82% 58%,88% 80%,64% 78%,50% 100%,36% 78%,12% 80%,18% 58%,0 45%,18% 34%,16% 12%,38% 18%)}
.cora .emb{background:linear-gradient(#3fcfc41a 1px,transparent 1px) 0 0/10px 10px,linear-gradient(90deg,#3fcfc41a 1px,transparent 1px) 0 0/10px 10px}
.cora .emb:after{content:'';position:absolute;left:18%;top:28%;width:55%;height:34%;border:1.5px solid #3fcfc488;border-left:0;border-bottom:0;box-shadow:12px 22px 0 -10px #3fcfc4aa}
.cora .lock{background:linear-gradient(90deg,#7a5420,#d8a956,#8c6128)}
.cora .ribbon{width:6px;border-radius:3px;clip-path:none;background:repeating-linear-gradient(#efe3cc 0 3px,#d6c6a6 3px 6px)}
/* opened diary */
#view{position:fixed;inset:0;z-index:900;display:none;align-items:center;justify-content:center;background:rgba(5,3,2,.78);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);perspective:1600px;padding:calc(env(safe-area-inset-top,0px) + 76px) 14px calc(env(safe-area-inset-bottom,0px) + 74px)}
#view.on{display:flex}
.open{position:relative;width:min(92vw,400px);height:min(100%,600px);transform-style:preserve-3d}
.open .cover{position:absolute;inset:0;border-radius:4px 12px 12px 4px;background:var(--cv);transform-origin:left center;transition:transform .9s cubic-bezier(.6,.05,.3,1);z-index:5;backface-visibility:hidden;box-shadow:0 20px 40px #000c}
#view.opened .open .cover{transform:rotateY(-170deg)}
.paper{position:absolute;inset:0;border-radius:3px 10px 10px 3px;overflow:hidden;box-shadow:0 20px 40px #000c,inset 10px 0 18px -10px #0006;transform-origin:left center;backface-visibility:hidden;background:var(--pp);color:var(--pi)}
.paper.flip{animation:flip .55s cubic-bezier(.5,0,.3,1)}
.paper.flipb{animation:flipb .55s cubic-bezier(.5,0,.3,1)}
@keyframes flip{0%{transform:rotateY(0)}49%{transform:rotateY(-88deg)}51%{transform:rotateY(-88deg)}100%{transform:rotateY(0)}}
@keyframes flipb{0%{transform:rotateY(0)}49%{transform:rotateY(88deg) translateX(-6px)}100%{transform:rotateY(0)}}
.pg{position:absolute;inset:0;padding:30px 24px 46px 30px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pg .d{font-family:'OuroborosHand','Nanum Pen Script',cursive;font-size:21px;opacity:.75;margin-bottom:10px}
.pg .t{white-space:pre-wrap;font-size:15px;line-height:30px}
.pg .num{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:11px;opacity:.5;letter-spacing:.15em}
.pg .corner{position:absolute;right:16px;bottom:12px;font-family:'OuroborosHand','Nanum Pen Script',cursive;font-size:17px;opacity:.6}
.pg.hid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.pg.hid .padlock{width:44px;height:52px;opacity:.35;background:currentColor;clip-path:path('M8 22V14C8 6 14 1 22 1C30 1 36 6 36 14V22H44V52H0V22ZM14 22H30V14C30 9 27 7 22 7C17 7 14 9 14 22Z')}
.pg.hid .msg{font-family:'OuroborosHand','Nanum Pen Script',cursive;font-size:20px;opacity:.4}
.pg.hid:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(-45deg,transparent 0 14px,rgba(0,0,0,.025) 14px 15px)}
.nia .paper{--pp:repeating-linear-gradient(transparent 0 29px,#c9a35f55 29px 30px) 0 50px/100% auto,linear-gradient(#f8f0e1,#f1e5cf);--pi:#4a3a24}
.mina .paper{--pp:radial-gradient(120% 120% at 50% 50%,transparent 70%,#d0404a26 100%),linear-gradient(#f2e6c6,#e9d9b2);--pi:#4a1e20}
.eris .paper{--pp:linear-gradient(90deg,transparent 92%,#a066ff22 92% 92.5%,transparent 92.5% 95%,#a066ff1c 95% 95.4%,transparent 95.4%),linear-gradient(#e6dcc6,#d8ccb2);--pi:#2c2236}
.cora .paper{--pp:linear-gradient(#3fcfc41c 1px,transparent 1px) 0 0/15px 15px,linear-gradient(90deg,#3fcfc41c 1px,transparent 1px) 0 0/15px 15px,linear-gradient(#f5eedf,#ece2cd);--pi:#1f3434}
.open .rib{position:absolute;bottom:-34px;left:44%;width:12px;height:52px;background:var(--rb);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);z-index:4}
.eris .open .rib{clip-path:polygon(0 0,100% 0,100% 72%,50% 100%,0 72%)}
.nav{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;justify-content:center;gap:12px;z-index:950}
.nav button{min-width:64px;height:44px;border-radius:22px;border:1px solid #ffffff26;background:rgba(10,12,18,.72);color:#e8dcc4;font:14px 'Gowun Batang'}
.nav[hidden]{display:none}
.nav button:disabled{opacity:.3}
.who{position:absolute;top:-30px;left:0;right:0;text-align:center;font-family:'OuroborosHand','Nanum Pen Script',cursive;font-size:22px;color:#e8cfa0}

/* page layout: scroll area + fixed footer (no overlap) */
.pg{overflow:hidden!important;padding:0!important}
.pg .sc{position:absolute;inset:0 0 46px 0;padding:30px 24px 24px 30px;overflow-y:auto;-webkit-overflow-scrolling:touch;-webkit-mask-image:linear-gradient(#000 calc(100% - 34px),transparent);mask-image:linear-gradient(#000 calc(100% - 34px),transparent)}
.pg.hid .sc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.empty1 .sc{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.empty1 .nm{font-family:'OuroborosHand','Nanum Pen Script',cursive;font-size:34px;opacity:.8}
.empty1 .orn{width:120px;height:1px;background:linear-gradient(90deg,transparent,currentColor,transparent);opacity:.35}
.empty1 .ln{font-size:13px;opacity:.5;letter-spacing:.08em}
/* tucked letters peeking from the page edge */
.tuck{position:absolute;right:-14px;bottom:70px;z-index:6;display:flex;flex-direction:column;gap:8px}
.env{width:86px;height:56px;border:0;padding:0;cursor:pointer;border-radius:3px;position:relative;transform:rotate(var(--r,-4deg));
  background:linear-gradient(160deg,#fbf6ea,#e9dcc2);box-shadow:0 4px 10px #0007;transition:transform .3s}
.env:active{transform:rotate(0) translateX(-10px)}
.env:before{content:'';position:absolute;inset:0;background:linear-gradient(to bottom right,transparent 49%,#0000001a 50%,transparent 51%),linear-gradient(to bottom left,transparent 49%,#0000001a 50%,transparent 51%);background-size:100% 60%;background-repeat:no-repeat}
.env:after{content:'';position:absolute;left:50%;top:26px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a8a,var(--sc,#9a1d2a) 70%);box-shadow:0 1px 2px #0008}
.env span{position:absolute;left:6px;bottom:3px;font-family:'OuroborosHand','Nanum Pen Script',cursive;font-size:13px;color:#6a5638}
.tuckl{position:absolute;right:8px;bottom:42px;z-index:6;font-family:'OuroborosHand','Nanum Pen Script',cursive;font-size:15px;opacity:.55}
.nia{--sc:#c9a35f}.mina{--sc:#8a1a28}.eris{--sc:#7a3fd0}.cora{--sc:#2a9e95}
/* unfolded letter */
#letter{position:fixed;inset:0;z-index:960;display:none;align-items:center;justify-content:center;background:rgba(5,3,2,.6);padding:calc(env(safe-area-inset-top,0px) + 76px) 18px calc(env(safe-area-inset-bottom,0px) + 74px);perspective:1200px}
#letter.on{display:flex}
.lp{position:relative;width:min(88vw,380px);height:min(100%,580px);border-radius:2px;color:#3b2c1c;
  background:linear-gradient(transparent 32.5%,#0000000d 33%,transparent 34%,transparent 65.5%,#0000000d 66%,transparent 67%),repeating-linear-gradient(transparent 0 31px,#b08a5a2e 31px 32px) 0 66px/100% auto,linear-gradient(#fffaf0,#f3e8d2);
  box-shadow:0 18px 40px #000c;transform-origin:top center;animation:unfold .8s cubic-bezier(.3,.7,.3,1)}
@keyframes unfold{0%{transform:rotateX(-75deg) scaleY(.33);opacity:.3}100%{transform:none;opacity:1}}
.lp .sc{position:absolute;inset:0 0 50px;padding:28px 24px 24px;overflow-y:auto;-webkit-mask-image:linear-gradient(#000 calc(100% - 34px),transparent);mask-image:linear-gradient(#000 calc(100% - 34px),transparent)}
.lp .to{font-family:'OuroborosHand','Nanum Pen Script',cursive;font-size:24px;margin-bottom:6px}
.lp .t{white-space:pre-wrap;font-size:15px;line-height:32px}
.lp .ft{position:absolute;left:24px;right:24px;bottom:16px;display:flex;justify-content:space-between;font-family:'OuroborosHand','Nanum Pen Script',cursive;font-size:17px;opacity:.65}
/* Cora brass corner guards */
.cg{display:none}
.cora .cg{display:block;position:absolute;width:30px;height:30px;z-index:3;pointer-events:none;
  background:linear-gradient(135deg,#fbe3a0 0%,#d9a84e 30%,#9a6a22 70%,#e7bf6a 100%);box-shadow:0 1px 2px #0009,inset 0 0 0 1px #5a3d10aa;filter:drop-shadow(0 1px 1px #000a)}
.cora .cg:after{content:'';position:absolute;width:5px;height:5px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c4,#7a5216);box-shadow:0 0 0 1px #4a320c}
.cora .cg.tr{top:-2px;right:-2px;clip-path:polygon(0 0,100% 0,100% 100%,78% 100%,78% 22%,0 22%);border-top-right-radius:9px}
.cora .cg.br{bottom:-2px;right:-2px;clip-path:polygon(78% 0,100% 0,100% 100%,0 100%,0 78%,78% 78%);border-bottom-right-radius:9px}
.cora .cg.tl{top:-2px;left:4px;clip-path:polygon(0 0,100% 0,100% 22%,22% 22%,22% 100%,0 100%)}
.cora .cg.bl{bottom:-2px;left:4px;clip-path:polygon(0 0,22% 0,22% 78%,100% 78%,100% 100%,0 100%)}
.cora .cg.tr:after{right:5px;top:1px}.cora .cg.br:after{right:5px;bottom:1px}.cora .cg.tl:after{left:1px;top:1px}.cora .cg.bl:after{left:1px;bottom:1px}
.cora .cg.tr{background-size:100% 100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<a class="topfix" href="https://mubael1246-design.github.io/hub/">← 허브로</a>
<a class="topfix r" href="./">편지함</a>
<h1>DIARIES</h1>
<p class="sub">자매들의 일기장</p>
<div id="gate"><input id="pw" type="password" placeholder="비밀번호" aria-label="비밀번호"><button id="go">열기</button><div id="gerr"></div></div>
<div id="shelf"></div>
<div id="view" role="dialog" aria-modal="true"></div>
<div id="letter" role="dialog" aria-modal="true"></div>
<div class="nav" id="nav" hidden><button id="prev">‹ 앞</button><button id="close">닫기</button><button id="next">뒤 ›</button></div>
<script>
const WHO={nia:{ko:'니아',en:'Nia',corner:'9/20'},mina:{ko:'미나',en:'Mina',corner:''},eris:{ko:'에리스',en:'Eris',corner:''},cora:{ko:'코라',en:'Cora',corner:'10/3'}};
const ORDER=['nia','mina','eris','cora'];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pw,file='notes.enc.json'){
  const e=await (await fetch(file+'?t='+Date.now(),{cache:'no-store'})).json();
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.salt),iterations:e.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},key,b64(e.ct))));
}
const UK='ouroboros-unlock';/* 허브·편지함과 같은 공유 잠금 (sessionStorage) */
const unl={get(){try{return sessionStorage.getItem(UK)}catch(_){return null}},set(v){try{sessionStorage.setItem(UK,v)}catch(_){}}};
let BOOKS={},LET={},cur=null,idx=0,li=-1;
/* 데이터: notes.enc.json
   - 기존 편지 {author,date,text}            → 일기장 사이에 끼워 둔 편지(봉투)
   - 앞으로 일기 쪽 {author,date,text,type:"diary",hidden?} → 일기장 쪽. hidden:true 면 잠긴 빈 쪽 */
function build(notes){
  BOOKS={};LET={};ORDER.forEach(k=>{BOOKS[k]=[];LET[k]=[]});
  notes.forEach(n=>{if(!BOOKS[n.author])return;(n.type==='diary'?BOOKS:LET)[n.author].push(n)});
  ORDER.forEach(k=>{BOOKS[k].sort((a,b)=>(a.date||'').localeCompare(b.date||''));LET[k].sort((a,b)=>(a.date||'').localeCompare(b.date||''))});
  $('#shelf').innerHTML=[ORDER.slice(0,2),ORDER.slice(2)].map(row=>'<div class="tier">'+row.map(k=>{
    const n=LET[k].length;
    return `<button class="book ${k}" data-k="${k}" aria-label="${WHO[k].ko}의 일기장"><span class="emb"></span><span class="cg tl"></span><span class="cg tr"></span><span class="cg bl"></span><span class="cg br"></span><span class="cnt">${n?'✉ '+n:''}</span><span class="ttl">${WHO[k].en}</span><span class="lock"></span><span class="ribbon"></span></button>`}).join('')+'</div>').join('');
  document.querySelectorAll('.book').forEach(b=>b.onclick=()=>openBook(b.dataset.k));
  $('#gate').style.display='none';$('#shelf').style.display='block';
}
function pageHTML(k){
  const ps=BOOKS[k],w=WHO[k],corner=w.corner?`<span class="corner">${w.corner}</span>`:'';
  if(!ps.length)return `<div class="pg empty1"><div class="sc"><div class="nm">${w.en}</div><div class="orn"></div><div class="ln">아직 쓰지 않은 첫 장</div></div>${corner}</div>`;
  const p=ps[idx],num=`<span class="num">${idx+1} / ${ps.length}</span>`;
  if(p.hidden)return `<div class="pg hid"><div class="sc"><span class="padlock"></span><div class="msg">잠긴 쪽</div></div>${num}${corner}</div>`;
  return `<div class="pg"><div class="sc"><div class="d">${esc(p.date||'')}</div><div class="t">${esc(p.text||'')}</div></div>${num}${corner}</div>`;
}
function tuckHTML(k){
  const L=LET[k];if(!L.length)return '';
  return `<div class="tuck">${L.map((l,i)=>`<button class="env" data-i="${i}" style="--r:${[-5,3,-2,4][i%4]}deg" aria-label="${esc(l.date||'')} 편지"><span>${esc((l.date||'').slice(5).replace('-','/'))}</span></button>`).join('')}</div><span class="tuckl">끼워 둔 편지 ${L.length}</span>`;
}
function openBook(k){
  cur=k;idx=0;const v=$('#view');v.className='on';
  v.innerHTML=`<div class="${k}" style="display:contents"><div class="open"><div class="who">${WHO[k].ko}의 일기장</div><div class="paper" id="paper">${pageHTML(k)}</div>${tuckHTML(k)}<div class="cover"><span class="emb"></span><span class="cg tl"></span><span class="cg tr"></span><span class="cg bl"></span><span class="cg br"></span></div><span class="rib"></span></div></div>`;
  v.querySelectorAll('.env').forEach(e=>e.onclick=ev=>{ev.stopPropagation();openLetter(+e.dataset.i)});
  requestAnimationFrame(()=>requestAnimationFrame(()=>v.classList.add('opened')));
  $('#nav').hidden=false;navState();
}
function letterHTML(){const l=LET[cur][li],w=WHO[cur];
  return `<div class="${cur}" style="display:contents"><div class="lp"><div class="sc"><div class="to">오빠에게,</div><div class="t">${esc(l.text||'')}</div></div><div class="ft"><span>${esc(l.date||'')}</span><span>— ${w.ko}</span></div></div></div>`}
function openLetter(i){li=i;const L=$('#letter');L.innerHTML=letterHTML();L.className='on';navState()}
function closeLetter(){li=-1;const L=$('#letter');L.className='';L.innerHTML='';navState()}
function navState(){const n=li>=0?LET[cur].length:BOOKS[cur].length,i=li>=0?li:idx;$('#prev').disabled=i<=0;$('#next').disabled=i>=n-1}
function turn(d){
  if(li>=0){const j=li+d;if(j<0||j>=LET[cur].length)return;openLetter(j);return}
  const n=BOOKS[cur].length,j=idx+d;if(j<0||j>=n)return;
  const p=$('#paper');p.classList.remove('flip','flipb');void p.offsetWidth;p.classList.add(d>0?'flip':'flipb');
  setTimeout(()=>{idx=j;p.innerHTML=pageHTML(cur);navState()},270);
}
function closeBook(){if(li>=0){closeLetter();return}const v=$('#view');v.classList.remove('opened');$('#nav').hidden=true;setTimeout(()=>{v.className='';v.innerHTML='';cur=null},500)}
$('#letter').addEventListener('click',e=>{if(e.target.id==='letter')closeLetter()});
$('#prev').onclick=()=>turn(-1);$('#next').onclick=()=>turn(1);$('#close').onclick=closeBook;
$('#view').addEventListener('click',e=>{if(e.target.id==='view')closeBook()});
let sx=0;$('#view').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
$('#view').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)turn(dx<0?1:-1)});
addEventListener('keydown',e=>{if(!cur)return;if(e.key==='ArrowRight')turn(1);if(e.key==='ArrowLeft')turn(-1);if(e.key==='Escape')closeBook()});
async function tryOpen(pw,silent){
  try{const notes=await decrypt(pw);unl.set(pw);build(notes.concat(window.__DIARY_EXTRA||[]))}
  catch(_){if(!silent)$('#gerr').textContent='비밀번호가 달라.'}
}
$('#go').onclick=()=>tryOpen($('#pw').value);$('#pw').onkeydown=e=>{if(e.key==='Enter')tryOpen($('#pw').value)};
const saved=unl.get();if(saved)tryOpen(saved,true);
</script>
</body>
