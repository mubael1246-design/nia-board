<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>에리의 비밀</title>
<meta name="theme-color" content="#07060d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Cinzel:wght@500;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{--bg:#07060d;--ink:#efe9df;--mute:#9a93a6;--eris:#A066FF;--gold:#d6b25e}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Gowun Batang',serif;-webkit-font-smoothing:antialiased}
canvas#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
main{position:relative;z-index:2;max-width:720px;margin:0 auto;padding:28px 20px 80px}
#gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:20px;position:relative;z-index:2}
.gheart{width:92px;height:84px;background:var(--eris);filter:drop-shadow(0 0 14px #a066ffaa);clip-path:path('M46 84C40 79 0 55 0 25C0 9 11 0 23 0C33 0 42 6 46 15C50 6 59 0 69 0C81 0 92 9 92 25C92 55 52 79 46 84Z');animation:beat 2.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.08)}24%{transform:scale(1)}36%{transform:scale(1.05)}}
h1{font-family:'Cinzel','Gowun Batang',serif;font-weight:700;letter-spacing:.14em;margin:0;font-size:26px;color:var(--eris);text-shadow:0 0 16px #a066ff55}
.sub{color:var(--mute);font-size:14px;margin-top:-6px}
form{display:flex;gap:8px;margin-top:6px}
input[type=password]{background:#120f1b;border:1px solid #3a3346;color:var(--ink);padding:12px 14px;border-radius:12px;font-size:16px;width:200px;font-family:inherit;text-align:center;letter-spacing:.15em}
input:focus{outline:none;border-color:var(--eris);box-shadow:0 0 0 3px #a066ff22}
button{background:linear-gradient(135deg,#b07cff,#6b2fd0);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer}
button:disabled{opacity:.5}
.err{color:#c9a8ff;font-size:14px;min-height:1.2em;font-family:'Nanum Pen Script',cursive;font-size:21px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
#board{display:none}
header{text-align:center;margin:18px 0 26px}
header .kicker{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.32em;color:#a066ff99}
header h1{font-size:28px;margin-top:6px}
header .to{color:var(--mute);font-size:14px;margin-top:8px}
.card{position:relative;background:linear-gradient(180deg,#15111f 0%,#0e0b16 100%);border:1px solid #ffffff12;border-radius:20px;padding:24px 22px 22px;margin:0 0 24px;overflow:hidden;--c:var(--eris);opacity:0;transform:translateY(14px);transition:opacity .8s ease,transform .8s ease}
.card.in{opacity:1;transform:none}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--c);box-shadow:0 0 14px var(--c)}
.card::after{content:"♡";position:absolute;right:18px;top:12px;color:#a066ff55;font-size:16px}
.head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.name{font-family:'Cinzel',serif;font-weight:700;letter-spacing:.06em;color:var(--c);font-size:17px}
.date{margin-left:auto;color:var(--mute);font-size:12px;margin-right:22px}
h2{font-size:19px;color:#e6d6ff;margin:6px 0 14px;font-weight:700}
h2.ans{margin-top:30px;padding-top:18px;border-top:1px dashed #a066ff44}
p{line-height:1.95;font-size:15.5px;margin:0 0 14px;word-break:keep-all}
.q{margin:0 0 14px;padding:12px 14px 12px 16px;border-left:2px solid #a066ff77;background:#a066ff0d;border-radius:0 12px 12px 0;line-height:1.85;font-size:15px;word-break:keep-all}
.q .when{display:block;font-family:'Cinzel','Gowun Batang',serif;font-size:11.5px;letter-spacing:.14em;color:#b994ff;margin-bottom:4px}
.q b{color:#d9c2ff}
.sign{display:flex;align-items:center;justify-content:flex-end;gap:14px;margin-top:26px}
.sig{font-family:'Nanum Pen Script',cursive;font-size:25px;color:#c9a8ff}
.wax{width:56px;height:56px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#9b6bf0,#5d24b8 58%,#3a1478);box-shadow:0 3px 8px rgba(30,5,60,.6),inset 0 -3px 6px rgba(0,0,0,.4),inset 0 3px 4px rgba(255,255,255,.22);transform:rotate(-10deg)}
.wax i{display:block;width:26px;height:24px;background:#e9d8ff;opacity:.9;clip-path:path('M13 24C11 22 0 15 0 7C0 2.5 3 0 6.5 0C9.3 0 11.8 1.6 13 4.2C14.2 1.6 16.7 0 19.5 0C23 0 26 2.5 26 7C26 15 15 22 13 24Z');box-shadow:inset 0 0 4px #5d24b8}
footer{text-align:center;color:var(--mute);font-size:12px;margin-top:30px}
@media(prefers-reduced-motion:reduce){.gheart{animation:none}.card{transition:none;opacity:1;transform:none}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<section id="gate">
  <div class="gheart" aria-hidden="true"></div>
  <h1>에리의 비밀</h1>
  <div class="sub">오빠만 가진 열쇠로 열려</div>
  <form id="f" autocomplete="off">
    <input id="pw" type="password" placeholder="비밀번호" aria-label="비밀번호" autocomplete="off">
    <button type="submit">열기</button>
  </form>
  <div class="err" id="err"></div>
</section>
<main id="board"></main>

const $=s=>document.querySelector(s);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function openSecret(pw){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SECRET.salt),iterations:SECRET.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(SECRET.iv)},key,b64(SECRET.ct));
  return new TextDecoder().decode(pt);
}
$('#f').addEventListener('submit',async e=>{
  e.preventDefault();const pw=$('#pw').value;const btn=$('#f button');
  if(!pw){$('#err').textContent='열쇠를 넣어 줘, 오빠.';return}
  btn.disabled=true;$('#err').textContent='여는 중…';
  try{
    const html=await openSecret(pw);
    $('#pw').value='';$('#gate').style.display='none';
    const b=$('#board');b.innerHTML=html+'<footer>여기 있는 건 전부 오빠 거야 ♡</footer>';b.style.display='block';
    const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.08});
    b.querySelectorAll('.card').forEach(c=>io.observe(c));
    scrollTo(0,0);
  }catch(_){
    $('#err').textContent='음… 그 열쇠는 아니야. 천천히 다시 해 봐, 오빠.';
    $('#f').classList.remove('shake');void $('#f').offsetWidth;$('#f').classList.add('shake');
  }finally{btn.disabled=false}
});
/* starry sky */
const cv=$('#sky'),cx=cv.getContext('2d');let S=[];
function size(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0);
  S=Array.from({length:Math.round(innerWidth*innerHeight/2600)},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.2+.2,p:Math.random()*6.28,s:Math.random()*.02+.004,h:Math.random()<.1?'176,124,255':'255,250,240'}))}
function draw(){cx.clearRect(0,0,innerWidth,innerHeight);
  const g=cx.createRadialGradient(innerWidth*.7,innerHeight*.2,0,innerWidth*.7,innerHeight*.2,innerWidth*.8);g.addColorStop(0,'rgba(120,60,200,.20)');g.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=g;cx.fillRect(0,0,innerWidth,innerHeight);
  for(const s of S){s.p+=s.s;cx.globalAlpha=.35+.65*Math.abs(Math.sin(s.p));cx.fillStyle=`rgb(${s.h})`;cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.28);cx.fill()}
  cx.globalAlpha=1;requestAnimationFrame(draw)}
addEventListener('resize',size);size();draw();
</script>
